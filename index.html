<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Agency Builder CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FAFAF9;--side:#F3F3F1;--surface:#FFFFFF;--surface-2:#F7F7F5;--hover:#F0F0ED;
  --ink:#1B1B1A;--ink-2:#46463F;--muted:#74746D;--faint:#A6A69F;--line:#E5E5E1;--line-2:#EEEEEA;
  --accent:#2D4FC4;--accent-ink:#FFFFFF;--accent-soft:#ECF0FC;
  --won:#1F7A4E;--won-soft:#E6F3EC;--lost:#B4433A;--lost-soft:#F9EAE8;--warn:#9C620E;--warn-soft:#FAF1E0;
  --pop:0 1px 2px rgba(0,0,0,.05),0 10px 30px rgba(0,0,0,.12);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#151514;--side:#101010;--surface:#1B1B1A;--surface-2:#20201E;--hover:#262624;
  --ink:#EDEDEA;--ink-2:#CACAC4;--muted:#98988F;--faint:#6E6E68;--line:#2B2B28;--line-2:#232321;
  --accent:#90A8FF;--accent-ink:#0E1430;--accent-soft:#1F2744;
  --won:#62C898;--won-soft:#15291F;--lost:#F08C82;--lost-soft:#2E1816;--warn:#E2B064;--warn-soft:#2A2212;
  --pop:0 1px 2px rgba(0,0,0,.4),0 12px 34px rgba(0,0,0,.5);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#151514;--side:#101010;--surface:#1B1B1A;--surface-2:#20201E;--hover:#262624;
  --ink:#EDEDEA;--ink-2:#CACAC4;--muted:#98988F;--faint:#6E6E68;--line:#2B2B28;--line-2:#232321;
  --accent:#90A8FF;--accent-ink:#0E1430;--accent-soft:#1F2744;
  --won:#62C898;--won-soft:#15291F;--lost:#F08C82;--lost-soft:#2E1816;--warn:#E2B064;--warn-soft:#2A2212;
  --pop:0 1px 2px rgba(0,0,0,.4),0 12px 34px rgba(0,0,0,.5);color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:13.5px/1.45 "Geist",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.011em}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.muted{color:var(--muted)}.small{font-size:12.5px}

.btn{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:7px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-weight:500;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn.primary:hover{opacity:.88;background:var(--ink)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--hover)}
.btn.sm{height:28px;padding:0 10px;font-size:13px}
.btn.lg{height:40px;font-size:14px;width:100%;justify-content:center}
.btn[disabled]{opacity:.55;cursor:default}
.btn.danger{color:var(--lost)}
.linkbtn{background:none;border:0;color:var(--accent);font:inherit;font-weight:500;cursor:pointer;padding:0}
.linkbtn[disabled]{color:var(--muted);cursor:default}
.icon-btn{width:28px;height:28px;border-radius:6px;border:0;background:transparent;color:var(--muted);display:grid;place-items:center;cursor:pointer;flex:none}
.icon-btn:hover{background:var(--hover);color:var(--ink)}
.icon-btn[disabled]{opacity:.3;cursor:default}
input:not([type=checkbox]):not([type=radio]),select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:7px 10px;width:100%}
textarea{resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.err{color:var(--lost);font-size:13px;margin:8px 0 0}
kbd{font:11.5px/1.6 inherit;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;color:var(--muted);background:var(--surface)}
.mark{width:26px;height:26px;border-radius:7px;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-weight:600;font-size:11px;flex:none}

/* ---------- Login ---------- */
.auth{display:flex;flex-direction:column;min-height:100%;padding:24px 28px}
.auth-left{background:var(--side);border-right:1px solid var(--line);padding:32px 44px;display:flex;flex-direction:column}
.logo{display:flex;align-items:center;gap:10px;font-weight:600;font-size:14px}
.win{margin:auto 0;max-width:620px;width:100%}
.win h2{font-size:26px;line-height:1.2;letter-spacing:-.02em;max-width:18ch}
.win>p{color:var(--muted);margin:10px 0 32px;max-width:52ch;font-size:14px}
.bands{display:grid;grid-template-columns:132px 1fr;row-gap:12px;column-gap:16px;align-items:center}
.axis{position:relative;height:16px;font-size:11.5px;color:var(--faint)}
.axis span{position:absolute;transform:translateX(-50%);white-space:nowrap}
.axis span:first-child{transform:none}.axis span:last-child{transform:translateX(-100%)}
.axis .nowlbl{color:var(--ink);font-weight:600}
.bcity strong{display:block;font-weight:500}
.bcity span{font-size:12.5px;color:var(--muted)}
.track{position:relative;height:26px;border-radius:6px;background:var(--surface);border:1px solid var(--line)}
.seg-b{position:absolute;top:3px;bottom:3px;border-radius:4px;background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 35%,transparent)}
.seg-b.live{background:var(--won-soft);border-color:color-mix(in srgb,var(--won) 45%,transparent)}
.nowline{position:absolute;top:-6px;bottom:-6px;width:2px;margin-left:-1px;background:var(--ink);border-radius:1px}
.win-key{display:flex;gap:18px;margin-top:22px;font-size:12.5px;color:var(--muted)}
.win-key span{display:flex;align-items:center;gap:7px}
.win-key i{width:14px;height:10px;border-radius:3px;background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 35%,transparent)}
.win-key i.live{background:var(--won-soft);border-color:color-mix(in srgb,var(--won) 45%,transparent)}
.auth-foot{color:var(--muted);font-size:12.5px;margin:0}
.auth-right{display:flex;flex-direction:column;padding:32px 24px}
.auth-card{width:100%;max-width:360px;margin:auto}
.auth-card h1{font-size:22px;letter-spacing:-.02em}
.auth-card .sub{color:var(--muted);margin:6px 0 26px;font-size:14px}
.gbtn{display:flex;width:100%;height:40px;align-items:center;justify-content:center;gap:10px;border:1px solid var(--line);background:var(--surface);border-radius:8px;font:inherit;font-size:14px;font-weight:500;color:var(--ink);cursor:pointer}
.gbtn:hover{background:var(--hover)}
.or{display:flex;align-items:center;gap:12px;color:var(--faint);font-size:12px;margin:18px 0}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.flabel{display:block;font-weight:500;margin-bottom:6px}
.auth-card input:not([type=checkbox]){height:40px;font-size:14px}
.auth-card form .btn{margin-top:12px}
.demo{margin-top:24px;padding:12px 14px;border:1px dashed var(--line);border-radius:8px;font-size:12.5px;color:var(--muted);display:flex;justify-content:space-between;gap:10px;align-items:center}
.demo strong{color:var(--ink-2);font-weight:500}
.back{display:inline-flex;align-items:center;gap:4px;margin-bottom:22px;color:var(--muted);font-weight:500}
.back:hover{color:var(--ink)}
.acct{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.acct li+li{border-top:1px solid var(--line)}
.acct button{width:100%;display:flex;gap:12px;align-items:center;padding:12px 14px;background:var(--surface);border:0;font:inherit;color:var(--ink);cursor:pointer;text-align:left}
.acct button:hover{background:var(--hover)}
.acct small{display:block;color:var(--muted);font-size:12.5px}
.otp{display:flex;gap:8px;align-items:center}
.otp input:not([type=checkbox]){width:46px;height:52px;text-align:center;font-size:22px;font-weight:600;padding:0}
.otp .gap{width:10px}
.otp.bad input:not([type=checkbox]){border-color:var(--lost)}
.check{display:flex;gap:8px;align-items:center;margin-top:18px;color:var(--ink-2)}
.fine{color:var(--muted);font-size:12.5px;margin:14px 0 0}
.auth-legal{display:flex;gap:18px;justify-content:center;font-size:12px;color:var(--faint)}
.auth-legal a{color:var(--faint);text-decoration:none}
.auth-legal a:hover{color:var(--ink)}
.ok-state{display:flex;align-items:center;gap:10px;color:var(--won);font-weight:500;margin-top:14px}

/* ---------- Shell ---------- */
.app{display:grid;grid-template-columns:224px minmax(0,1fr);height:100%}
.app.chat-open{grid-template-columns:224px minmax(0,1fr) 380px}
.side{background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:10px 8px;min-height:0;overflow:auto}
.ws{display:flex;align-items:center;gap:9px;padding:6px 8px;border:0;background:none;border-radius:7px;font:inherit;font-weight:600;color:var(--ink);cursor:default;margin-bottom:10px;text-align:left}
.nav{display:grid;gap:1px}
.nav a,.vlink{display:flex;align-items:center;gap:9px;padding:6px 8px;border-radius:6px;color:var(--ink-2);text-decoration:none;font-weight:500;border:0;background:none;font:inherit;font-weight:500;cursor:pointer;text-align:left;width:100%}
.nav a svg{color:var(--muted)}
.nav a:hover,.vlink:hover{background:var(--hover)}
.nav a[aria-current=page],.vlink[aria-current=true]{background:var(--surface);color:var(--ink);box-shadow:0 0 0 1px var(--line)}
.nav a[aria-current=page] svg{color:var(--ink)}
.nav .count{margin-left:auto;font-size:12px;color:var(--faint);font-weight:400}
.side-h{font-size:12px;color:var(--faint);padding:18px 8px 6px;font-weight:500}
.vlink i{width:8px;height:8px;border-radius:2px;flex:none}
.side-foot{margin-top:auto;padding:10px 4px 2px;display:grid;gap:6px}
.me{display:flex;gap:9px;align-items:center;padding:4px}
.me small{display:block;color:var(--muted);font-size:12px}
.side-actions{display:flex;gap:2px}
.main{overflow:auto;min-width:0;height:100%}
.top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);display:flex;align-items:center;gap:8px;padding:10px 28px;border-bottom:1px solid var(--line)}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:0 8px 0 10px;height:32px;flex:1;max-width:380px;color:var(--muted)}
.search input:not([type=checkbox]){border:0;padding:0;background:transparent;box-shadow:none;height:100%}
.search:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.top .spacer{flex:1}
.page{padding:22px 28px 56px;max-width:1340px}
.ph{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap;min-height:32px}
.ph h1{font-size:18px}
.ph .meta{color:var(--muted)}
.ph .acts{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--hover);border-radius:7px;padding:2px}
.seg button{border:0;background:transparent;font:inherit;font-size:13px;font-weight:500;color:var(--muted);padding:4px 10px;border-radius:5px;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--surface);color:var(--ink);box-shadow:0 0 0 1px var(--line)}

/* stage, avatar, tag */
.st{display:inline-flex;align-items:center;gap:7px;white-space:nowrap;color:var(--ink-2)}
.st i{width:8px;height:8px;border-radius:2px;background:var(--faint);flex:none}
.st.mid i{background:color-mix(in srgb,var(--accent) 50%,var(--surface))}
.st.late i{background:var(--accent)}
.st.won i{background:var(--won)}.st.won{color:var(--won)}
.st.lost i{background:var(--lost)}.st.lost{color:var(--lost)}
.av{--h:#74746D;width:24px;height:24px;border-radius:50%;display:inline-grid;place-items:center;font-size:10.5px;font-weight:600;flex:none;background:color-mix(in srgb,var(--h) 18%,var(--surface));color:color-mix(in srgb,var(--h) 85%,var(--ink))}
.av.lg{width:40px;height:40px;font-size:14px}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.tag{--h:#2D4FC4;display:inline-flex;align-items:center;gap:3px;height:19px;padding:0 6px;border-radius:4px;font-size:11.5px;font-weight:500;white-space:nowrap;background:color-mix(in srgb,var(--h) 12%,transparent);color:color-mix(in srgb,var(--h) 80%,var(--ink))}
.tag button{border:0;background:none;color:inherit;padding:0;margin-right:-2px;cursor:pointer;display:grid;place-items:center;opacity:.6}
.tag button:hover{opacity:1}
.dot{width:7px;height:7px;border-radius:50%;background:var(--faint);display:inline-block;flex:none}
.dot.ok{background:var(--won)}
.due{color:var(--muted);white-space:nowrap}
.due.late{color:var(--warn);font-weight:500}

/* filters */
.filters{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:0 0 14px}
.filters select{width:auto;padding:4px 26px 4px 9px;font-size:13px;height:28px;border-radius:6px}
.fchip{height:28px;padding:0 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface);font:inherit;font-size:13px;font-weight:500;color:var(--ink-2);cursor:pointer}
.fchip[aria-pressed=true],.filters select.on{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 45%,transparent);color:var(--accent)}
.filters .linkbtn{font-size:13px;margin-left:4px}

/* Calls */
.calls{max-width:900px}
.grp{display:flex;align-items:baseline;gap:8px;margin:20px 0 8px}
.grp h2{font-size:13.5px}
.grp h2.late{color:var(--warn)}
.grp span{color:var(--faint);font-size:12.5px}
.list{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:9px;background:var(--surface);overflow:hidden}
.qrow{display:grid;grid-template-columns:70px minmax(0,1fr) 150px 28px auto;gap:14px;align-items:center;padding:11px 14px;border-top:1px solid var(--line-2);cursor:pointer}
.qrow:first-child{border-top:0}
.qrow:hover{background:var(--surface-2)}
.q-when{font-weight:500;color:var(--ink-2)}
.q-when.late{color:var(--warn)}
.q-who strong{font-weight:500}
.q-who em{font-style:normal;color:var(--muted);margin-left:6px}
.q-who span{display:block;color:var(--muted);font-size:13px;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.q-tz{font-size:13px;display:flex;align-items:center;gap:7px;color:var(--ink-2)}
.empty{padding:36px 20px;text-align:center;color:var(--muted)}

/* Pipeline */
.board-wrap{overflow-x:auto;margin:0 -28px;padding:0 28px 16px}
.board{display:flex;gap:10px;min-width:max-content;align-items:flex-start}
.col{width:250px;flex:none}
.col header{display:flex;align-items:center;gap:7px;padding:4px 4px 8px;font-weight:500}
.col-count{color:var(--faint);font-size:12.5px}
.col-sum{margin-left:auto;color:var(--muted);font-size:12.5px}
.col-body{padding:4px;min-height:140px;display:flex;flex-direction:column;gap:6px;border-radius:9px;background:var(--side);transition:background .12s}
.col-body.over{background:var(--accent-soft)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:9px 10px;cursor:grab}
.card:hover{border-color:var(--faint)}
.card.dragging{opacity:.4}
.card-top{display:flex;justify-content:space-between;gap:8px;align-items:center}
.card-top strong{font-weight:500}
.card-co{color:var(--muted);font-size:12.5px;margin:1px 0 8px}
.card .tags{margin:-3px 0 8px}
.card-foot{display:flex;justify-content:space-between;gap:8px;font-size:12.5px}
.val{font-weight:500}
.col-empty{color:var(--faint);font-size:12.5px;text-align:center;padding:22px 0;margin:0}

/* Tables */
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:9px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:880px}
th{text-align:left;font-weight:500;color:var(--muted);font-size:12.5px;padding:0 12px;height:34px;border-bottom:1px solid var(--line);background:var(--surface-2);white-space:nowrap}
th button{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:4px}
th button:hover{color:var(--ink)}
th button:focus-visible{outline:2px solid var(--accent)}
th[aria-sort] button{color:var(--ink)}
td{padding:9px 12px;border-top:1px solid var(--line-2);vertical-align:middle}
tbody tr:first-child td{border-top:0}
tbody tr[data-open],tbody tr[data-proj]{cursor:pointer}
tbody tr[data-open]:hover,tbody tr[data-proj]:hover{background:var(--surface-2)}
td strong{font-weight:500}
.sub2{display:block;color:var(--muted);font-size:12.5px}
.num{text-align:right}
.tz-cell{display:flex;align-items:center;gap:7px}
.bar{height:5px;background:var(--line-2);border-radius:3px;overflow:hidden;width:100px}
.bar i{display:block;height:100%;background:var(--ink-2);border-radius:3px}
.bar.done i{background:var(--won)}
.prog{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--muted)}

/* Dashboard */
.kpis{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:9px;background:var(--surface);margin:0 0 16px}
.kpis>div{padding:14px 16px;border-left:1px solid var(--line-2)}
.kpis>div:first-child{border-left:0}
.kpis dt{color:var(--muted);font-size:12.5px}
.kpis dd{margin:4px 0 0;font-size:22px;font-weight:600;letter-spacing:-.02em;display:flex;align-items:baseline;gap:8px}
.kpis dd small{font-size:12px;font-weight:500;letter-spacing:0}
.up{color:var(--won)}.down{color:var(--lost)}
.grow td{background:var(--surface-2);padding:7px 12px;border-top:1px solid var(--line)!important;font-weight:500}
.grow td .st{margin-right:8px}
.grow .gsum{float:right;color:var(--muted);font-weight:400}
tbody:first-of-type .grow td{border-top:0!important}
.stg+.stg{margin-top:16px;padding-top:14px;border-top:1px solid var(--line-2)}
.stg-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.stg-h span{color:var(--muted);font-size:12.5px}
.stg-h strong{font-weight:600;font-size:15px;letter-spacing:-.01em}
.stg-bar{display:flex;gap:2px;height:10px;border-radius:5px;overflow:hidden;background:var(--line-2);margin-bottom:8px}
.stg-bar i{display:block;min-width:3px}
.stg-list{list-style:none;margin:0;padding:0}
.stg-list button{all:unset;box-sizing:border-box;display:grid;grid-template-columns:9px minmax(0,1fr) 24px 56px;gap:10px;align-items:center;width:calc(100% + 12px);padding:6px;margin:0 -6px;border-radius:6px;cursor:pointer}
.stg-list button:hover{background:var(--hover)}
.stg-list button:focus-visible{outline:2px solid var(--accent)}
.stg-list i{width:9px;height:9px;border-radius:2px}
.stg-list .c{color:var(--muted);text-align:right}
.stg-list .v{text-align:right;font-weight:500}
.stg-list .zero{color:var(--faint)}
.stg-list .zero .v{font-weight:400}
.dash{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.chart{border:1px solid var(--line);border-radius:9px;background:var(--surface);padding:14px 16px 16px;min-width:0}
.chart.span2{grid-column:span 2}
.chart-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:14px}
.chart-h h2{font-size:13.5px}
.chart-h span{color:var(--muted);font-size:12.5px}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.ax{font:11px "Geist",system-ui,sans-serif;fill:var(--faint)}
.gl{stroke:var(--line-2);stroke-width:1}
.b{fill:var(--ink-2);opacity:.18}
.b.now{fill:var(--accent);opacity:1}
.bl{font:500 11px "Geist",system-ui,sans-serif;fill:var(--muted)}
.hbar{display:grid;grid-template-columns:minmax(96px,130px) 1fr auto;gap:10px;align-items:center;padding:5px 0}
.hbar .track2{height:8px;background:var(--line-2);border-radius:4px;overflow:hidden}

.hbar .n{font-weight:500;white-space:nowrap;text-align:right;min-width:76px}

.chart h3{font-size:12px;color:var(--muted);font-weight:500;margin:10px 0 2px}
.donut-wrap{display:flex;gap:18px;align-items:center;flex-wrap:wrap}

.legend{list-style:none;margin:0;padding:0;flex:1;min-width:150px}

.legend i{width:9px;height:9px;border-radius:2px}

.dc-total{font:600 22px "Geist",system-ui,sans-serif;fill:var(--ink)}
.dc-lbl{font:11px "Geist",system-ui,sans-serif;fill:var(--muted)}

.panel{border:1px solid var(--line);border-radius:9px;background:var(--surface);padding:2px 18px 6px;margin-bottom:16px;max-width:880px}
.panel h2{font-size:13.5px;margin:14px 0 6px}
.panel-head{display:flex;justify-content:space-between;align-items:center}
.panel .note{margin:-2px 0 10px}
.srow{display:flex;justify-content:space-between;align-items:center;gap:20px;padding:12px 0;border-top:1px solid var(--line-2)}
.srow strong{font-weight:500}
.srow p{margin:2px 0 0;color:var(--muted);font-size:12.5px}
.srow select{width:auto}
.panel table{min-width:600px}
.panel .table-wrap{border:0;border-radius:0;margin:0 -18px}
.panel th{background:transparent}
.panel td select{width:auto;padding:4px 8px}
code{font:12.5px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--hover);padding:2px 6px;border-radius:4px;white-space:nowrap}
.switch{position:relative;display:inline-block;width:34px;height:20px;flex:none}
.switch input{position:absolute;inset:0;opacity:0;width:100%;height:100%;margin:0;cursor:pointer;z-index:1}
.switch span{position:absolute;inset:0;background:var(--line);border-radius:10px;transition:background .15s}
.switch span::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:transform .15s}

.switch input:checked+span::after{transform:translateX(14px)}
.switch input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.log{list-style:none;margin:0;padding:0}
.log li{display:flex;justify-content:space-between;gap:16px;padding:10px 0;border-top:1px solid var(--line-2)}
.log li span:last-child{color:var(--muted);white-space:nowrap}
.log li.warn span:first-child{color:var(--warn)}
.howto{max-width:880px;color:var(--muted);font-size:12.5px;margin:6px 0 0}

.scrim{position:fixed;inset:0;background:rgba(0,0,0,.18);z-index:20}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(470px,100%);background:var(--surface);border-left:1px solid var(--line);box-shadow:var(--pop);z-index:21;transform:translateX(100%);visibility:hidden;transition:transform .2s ease,visibility .2s;overflow-y:auto;padding:calc(18px + env(safe-area-inset-top,0px)) 22px calc(32px + env(safe-area-inset-bottom,0px))}

.dr-head{display:flex;gap:12px;align-items:center}
.dr-title{flex:1;min-width:0}
.dr-title h2{font-size:17px}

.fields .wide dd{display:flex;gap:10px;align-items:center}
.sec h3{font-size:13.5px;margin:0 0 10px}
.note-form{display:grid;gap:8px;margin-bottom:12px}
.note-form .btn{justify-self:end}
.tl{list-style:none;margin:0;padding:0}
.tl li{display:grid;grid-template-columns:26px 1fr;gap:10px;padding:10px 0;border-top:1px solid var(--line-2)}
.t-ico{width:26px;height:26px;border-radius:50%;background:var(--hover);display:grid;place-items:center;color:var(--ink-2)}
.t-meta{font-size:12px;color:var(--muted)}
.t-text{margin:2px 0 0}
.prog-line{display:flex;align-items:center;gap:12px;margin:-8px 0 20px;font-size:12.5px;color:var(--muted)}

.tasks{list-style:none;padding:0;margin:0 0 12px}
.tasks label{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line-2);cursor:pointer}
.tasks input{width:15px;height:15px;accent-color:var(--won);flex:none}
.tasks .done span{color:var(--muted);text-decoration:line-through}
.stages{list-style:none;margin:0 0 12px;padding:0}
.stages li{display:flex;align-items:center;gap:4px;padding:5px 0;border-top:1px solid var(--line-2)}

.stages li.locked{padding:10px 0 10px 11px;color:var(--muted)}
.stages li.locked span:first-child{flex:1}

.chat{border-left:1px solid var(--line);background:var(--surface);display:none;flex-direction:column;min-height:0;height:100%}
.app.chat-open .chat{display:flex}
.chat-head{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}

.chat-head .icon-btn{margin-left:auto}
.chat-body{flex:1;overflow:auto;padding:16px 14px;display:flex;flex-direction:column;gap:14px}
.msg{max-width:100%}
.msg.you{align-self:flex-end;background:var(--hover);padding:8px 11px;border-radius:10px 10px 3px 10px;max-width:85%}

.chat-note{font-size:11.5px;color:var(--faint);padding:0 12px 10px}

.modal-wrap{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.28);display:grid;place-items:center;padding:20px}

.m-foot{display:flex;justify-content:flex-end;gap:8px;padding:14px 18px 16px}

.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{background:none;border:0;color:var(--bg);font:inherit;font-weight:600;text-decoration:underline;cursor:pointer;padding:0}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (max-width:1100px){.app.chat-open{grid-template-columns:224px minmax(0,1fr)}.app.chat-open .chat{position:fixed;top:0;right:0;bottom:0;width:min(400px,100%);z-index:19;box-shadow:var(--pop)}}

  .srow{flex-wrap:wrap}

}

function fmtDue(d){

  const n=dayDiff(d);
  if(n<0) return (-n)+(n===-1?' day':' days')+' overdue';
  if(n===0) return 'Today '+tm(d);

  return d.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'});
}

function theirTime(tz,at){
  const now=at||new Date();
  const p={};new Intl.DateTimeFormat('en-US',{timeZone:tz,hour:'numeric',weekday:'short',hourCycle:'h23'}).formatToParts(now).forEach(x=>p[x.type]=x.value);
  const h=(+p.hour)%24,weekend=p.weekday==='Sat'||p.weekday==='Sun';
  const time=now.toLocaleTimeString('en-AU',{timeZone:tz,hour:'numeric',minute:'2-digit'});
  const ok=!weekend&&h>=9&&h<19;
  return {time,ok,weekend,label:ok?'Good time to call':weekend?'Weekend there':h<9?'Too early there':'After hours there'};
}
function tzOffsetMin(tz){
  const now=new Date(),p={};
  new Intl.DateTimeFormat('en-US',{timeZone:tz,hourCycle:'h23',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}).formatToParts(now).forEach(x=>p[x.type]=x.value);

function drawBands(){
  const now=new Date(),viewOff=-now.getTimezoneOffset(),nowMin=now.getHours()*60+now.getMinutes(),pct=m=>(m/1440*100).toFixed(2)+'%';
  const axis=['12 am','6 am','12 pm','6 pm','12 am'].map((l,i)=>`<span style="left:${i*25}%">${l}</span>`).join('');
  const rows=BAND_CITIES.map(([city,tz])=>{
    const t=theirTime(tz,now),diff=tzOffsetMin(tz)-viewOff;
    let s=((9*60-diff)%1440+1440)%1440,e=s+600;
    const segs=e<=1440?[[s,e]]:[[s,1440],[0,e-1440]];
    const live=t.ok;
    return `<div class="bcity"><strong>${city}</strong><span>${t.time}${t.weekend?', weekend':''}</span></div>
      <div class="track" title="${city}: ${t.label.replace(' there','')}">${t.weekend?'':segs.map(([a,b])=>`<div class="seg-b ${live&&nowMin>=a&&nowMin<b?'live':''}" style="left:${pct(a)};width:${pct(b-a)}"></div>`).join('')}<div class="nowline" style="left:${pct(nowMin)}"></div></div>`;
  }).join('');
  $('#bands').innerHTML=`<div></div><div class="axis">${axis}</div>${rows}`;
}

const DUE_OPTS=[['any','Any due date'],['overdue','Overdue'],['today','Due today'],['week','Due in 7 days'],['none','No next step']];
const FILTER_DEFAULTS={owner:'all',due:'any',source:'all',tag:'all',cold:false,cpipe:'all',cstage:'all'};
function passFilters(d,c){
  if(state.owner!=='all'&&d.owner!==state.owner)return false;
  if(state.source!=='all'&&c.source!==state.source)return false;
  if(state.tag!=='all'&&!(c.tags||[]).includes(state.tag))return false;
  if(state.cold&&!(isOpen(d)&&dayDiff(d.touched)<=-5))return false;
  const n=d.due?dayDiff(d.due):null;
  if(state.due==='overdue')return isOpen(d)&&n!=null&&n<0;
  if(state.due==='today')return isOpen(d)&&n===0;
  if(state.due==='week')return isOpen(d)&&n!=null&&n>=0&&n<=6;
  if(state.due==='none')return isOpen(d)&&!d.due;
  return true;
}
function activeCount(withContacts){
  const base=[state.owner!=='all',state.due!=='any',state.source!=='all',state.tag!=='all',state.cold];
  if(withContacts)base.push(state.cpipe!=='all',state.cstage!=='all');
  return base.filter(Boolean).length;
}

function pipeList(list,P){

    <thead><tr><th>Name</th><th>Business</th><th>Owner</th><th>Next step</th><th>Their time</th><th class="num">Value</th></tr></thead>

    ${g.ds.map(d=>{const c=byC(d.cid),t=theirTime(c.tz),n=d.due?dayDiff(d.due):null,tg=c.tags||[];return `<tr data-open="${c.id}" tabindex="0">
      <td><strong>${esc(c.name)}</strong>${tg.length?`<span class="tags">${tg.map(x=>tagEl(x)).join('')}</span>`:''}</td>
      <td>${esc(c.company||'Agency lead')}<span class="sub2">${esc(c.city)}</span></td>
      <td>${avatar(d.owner)}</td>
      <td>${isOpen(d)?`${esc(d.next||'None')}<span class="sub2 due ${n!=null&&n<0?'late':''}">${fmtDue(d.due)}</span>`:'<span class="muted">Closed</span>'}</td>
      <td><span class="tz-cell" title="${t.label}"><span class="dot ${t.ok?'ok':''}"></span>${t.time}</span></td>
      <td class="num">${money(d.value)}</td>
    </tr>`}).join('')}</tbody>`).join('')}
  </table></div>`;
}

const stageIdx=d=>PIPES[d.pipe].stages.indexOf(d.stage);

const SORTS={name:(a,b)=>a.c.name.localeCompare(b.c.name),business:(a,b)=>(a.c.company||'zzz').localeCompare(b.c.company||'zzz'),stage:(a,b)=>cmp(stageIdx(a.d),stageIdx(b.d)),owner:(a,b)=>TEAM[a.d.owner].name.localeCompare(TEAM[b.d.owner].name),next:(a,b)=>cmp(a.d.due&&isOpen(a.d)?+a.d.due:9e15,b.d.due&&isOpen(b.d)?+b.d.due:9e15),value:(a,b)=>cmp(a.d.value,b.d.value)};

/* Dashboard */
const SRC_COL=['#2D4FC4','#1F7A4E','#B7791F','#7A3FB8','#0F7C86'];
const niceMax=m=>{const p=Math.pow(10,Math.floor(Math.log10(m)));const n=m/p;return (n<=2?2:n<=5?5:10)*p};
function closedAll(){return [...HISTORY,...deals.filter(d=>!isOpen(d)).map(d=>({pipe:d.pipe,value:d.value,owner:d.owner,source:(byC(d.cid)||{}).source,won:d.stage==='Won',closedAt:d.closedAt||d.touched}))]}
function renderDashboard(){
  if(!deals.length&&!HISTORY.length)return `<div class="ph"><h1>Dashboard</h1></div>`+emptyState('No deals yet','Add your first contact, or load sample data to see how the dashboard works.');
  if(state.dpipe!=='all'&&!PIPES[state.dpipe])state.dpipe='all';
  const pf=state.dpipe,inP=x=>pf==='all'||x.pipe===pf;
  const closed=closedAll().filter(inP),open=deals.filter(d=>isOpen(d)&&inP(d));
  const sum=a=>a.reduce((s,x)=>s+x.value,0),ago=x=>-dayDiff(x.closedAt);
  const won=closed.filter(x=>x.won),w30=won.filter(x=>ago(x)<=30),wPrev=won.filter(x=>ago(x)>30&&ago(x)<=60);
  const c30=closed.filter(x=>ago(x)<=30);
  const rate=c30.length?Math.round(c30.filter(x=>x.won).length/c30.length*100):0;
  const avg=w30.length?Math.round(sum(w30)/w30.length):0;
  const delta=sum(wPrev)?Math.round((sum(w30)-sum(wPrev))/sum(wPrev)*100):null;
  const weeks=Array.from({length:8},(_,i)=>{const k=7-i,list=won.filter(x=>Math.floor(ago(x)/7)===k);return {k,v:sum(list),n:list.length,label:k===0?'This week':at(-(k*7+6),0).toLocaleDateString('en-GB',{day:'numeric',month:'short'})}});
  const top=niceMax(Math.max(...weeks.map(w=>w.v),1000));
  const W=640,H=210,L=44,B=24,T=18,bw=(W-L)/8,ph=H-B-T;
  const grid=[0,top/2,top].map(v=>{const y=H-B-v/top*ph;return `<line class="gl" x1="${L}" x2="${W}" y1="${y}" y2="${y}"/><text class="ax" x="${L-8}" y="${y+4}" text-anchor="end">${short(v)}</text>`}).join('');
  const bars=weeks.map((w,i)=>{const h=w.v/top*ph,x=L+i*bw+bw*.2,y=H-B-h,cx=L+i*bw+bw/2;return `<g><title>${w.label}: ${money(w.v)}, ${w.n} ${w.n===1?'deal':'deals'}</title><rect class="b ${w.k===0?'now':''}" x="${x}" y="${y}" width="${bw*.6}" height="${Math.max(h,0)}" rx="3"/>${w.v?`<text class="bl" x="${cx}" y="${y-6}" text-anchor="middle">${short(w.v)}</text>`:''}<text class="ax" x="${cx}" y="${H-6}" text-anchor="middle">${w.label}</text></g>`}).join('');
  const keys=pf==='all'?Object.keys(PIPES):[pf];
  const fun=keys.map(k=>({k,rows:openStages(k).map(s=>{const ds=deals.filter(d=>d.pipe===k&&d.stage===s);return {s,n:ds.length,v:sum(ds)}})}));
  const fmax=Math.max(1,...fun.flatMap(f=>f.rows.map(r=>r.n)));
  const src=SOURCES.map((s,i)=>{const cs=closed.filter(x=>x.source===s);return {s,n:open.filter(d=>(byC(d.cid)||{}).source===s).length+cs.length,col:SRC_COL[i],rate:cs.length?Math.round(cs.filter(x=>x.won).length/cs.length*100):null}}).filter(x=>x.n);
  const tot=src.reduce((a,x)=>a+x.n,0)||1,R=54,C=2*Math.PI*R;let off=0;
  const arcs=src.map(x=>{const len=x.n/tot*C,l=Math.max(len-2,0);const el=`<circle cx="66" cy="66" r="${R}" fill="none" style="stroke:${x.col}" stroke-width="16" stroke-dasharray="${l} ${C-l}" stroke-dashoffset="${-off}" transform="rotate(-90 66 66)"><title>${x.s}: ${x.n}</title></circle>`;off+=len;return el}).join('');
  const reps=Object.entries(TEAM).filter(([k])=>CALLS_BASE[k]!=null||deals.some(d=>d.owner===k)).map(([k,u])=>{const ww=w30.filter(x=>x.owner===k);return {k,name:u.name,v:sum(ww),calls:(CALLS_BASE[k]||0)+acts.filter(a=>a.type==='call'&&a.by===k&&dayDiff(a.when)>=-6).length}}).sort((a,b)=>b.v-a.v);
  const rmax=Math.max(1,...reps.map(r=>r.v));
  return `<div class="ph"><h1>Dashboard</h1><span class="meta">Last 30 days</span>
    <div class="acts"><div class="seg" role="group" aria-label="Pipeline"><button data-dpipe="all" aria-pressed="${pf==='all'}">All</button>${Object.entries(PIPES).map(([k,p])=>`<button data-dpipe="${k}" aria-pressed="${pf===k}">${esc(p.short||p.name)}</button>`).join('')}</div></div></div>
  <dl class="kpis">
    <div><dt>Won</dt><dd>${money(sum(w30))}${delta==null?'':`<small class="${delta>=0?'up':'down'}">${delta>=0?'+':''}${delta}%</small>`}</dd></div>
    <div><dt>Open pipeline</dt><dd>${money(sum(open))}<small class="muted">${open.length} deals</small></dd></div>
    <div><dt>Close rate</dt><dd>${rate}%</dd></div>
  </dl>
  <div class="dash">
    <section class="chart span2"><div class="chart-h"><h2>Revenue won by week</h2><span>${money(sum(weeks))} over 8 weeks</span></div>
      <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Revenue won by week">${grid}${bars}</svg></section>
    <section class="chart"><div class="chart-h"><h2>Open deals by stage</h2><span>${open.length} deals</span></div>
      ${fun.map(f=>{
        const tv=f.rows.reduce((a,r)=>a+r.v,0),m=f.rows.length;
        const shade=i=>`color-mix(in srgb,var(--accent) ${Math.round(22+78*(m>1?i/(m-1):1))}%,var(--surface))`;
        return `<div class="stg"><div class="stg-h"><span>${esc(PIPES[f.k].short||PIPES[f.k].name)}</span><strong>${money(tv)}</strong></div>
        <div class="stg-bar" role="img" aria-label="Open value by stage">${f.rows.map((r,i)=>r.v?`<i style="flex:${r.v};background:${shade(i)}" title="${esc(r.s)}: ${money(r.v)}"></i>`:'').join('')}</div>
        <ul class="stg-list">${f.rows.map((r,i)=>`<li><button type="button" data-stagego="${f.k}" ${r.n?'':'class="zero"'} title="Open ${esc(r.s)} in the pipeline"><i style="background:${shade(i)}"></i><span>${esc(r.s)}</span><span class="c">${r.n}</span><span class="v">${short(r.v)}</span></button></li>`).join('')}</ul></div>`;
      }).join('')}</section>
  </div>`;
}

  const d=deals.find(x=>x.id===did);if(!d||d.stage===st)return;

function pipesClick(b){
  const key=state.drawer.id,P=PIPES[key],st=P.stages,cnt=s=>deals.filter(d=>d.pipe===key&&d.stage===s).length;
  if(b.hasAttribute('data-up')||b.hasAttribute('data-down')){

    [st[i],st[j]]=[st[j],st[i]];refresh();
  } else if(b.hasAttribute('data-delstage')){
    const i=+b.dataset.delstage,name=st[i],n=cnt(name),open=openStages(key),to=open[i-1]||open[i+1];
    deals.forEach(d=>{if(d.pipe===key&&d.stage===name)d.stage=to});
    st.splice(i,1);refresh();toast(n?`Stage deleted. ${n} moved to ${to}`:'Stage deleted');
  } else if(b.hasAttribute('data-newpipe')){
    openModal({title:'New pipeline',submit:'Create pipeline',body:`<label>Name<input name="name" placeholder="For example, Partnerships"></label><p class="m-sub small">Starts with New lead, In progress, Won and Lost.</p><p class="err" hidden></p>`,
      onSubmit(E){
        const name=clean(E.name.value);
        if(!name)return showErr('Add a name.');
        if(Object.values(PIPES).some(p=>p.name.toLowerCase()===name.toLowerCase()))return showErr('A pipeline with this name already exists.');
        const k='p'+Date.now().toString(36);PIPES[k]={name,short:name,stages:['New lead','In progress','Won','Lost']};
        state.pipe=k;state.drawer.id=k;refresh();toast('Pipeline created');
      }});
  } else if(b.hasAttribute('data-delpipe')){
    if(Object.keys(PIPES).length<2)return toast('You need at least one pipeline');
    const used=deals.filter(d=>d.pipe===key).length+projects.filter(p=>p.type===key).length;
    if(used)return toast(`Move its ${used} deals and projects first`);
    delete PIPES[key];state.pipe=Object.keys(PIPES)[0];state.drawer.id=state.pipe;refresh();toast('Pipeline deleted');
  }
}
function pipesChange(t){
  const key=state.drawer.id,P=PIPES[key];
  if(t.hasAttribute('data-pickpipe')){state.drawer.id=state.pipe=t.value;refresh();return}
  if(t.hasAttribute('data-pipename')){const v=clean(t.value);if(!v){t.value=P.name;return toast('Add a name')}P.name=P.short=v;refresh();return toast('Saved')}
  if(t.dataset.stagename!=null){
    const i=+t.dataset.stagename,old=P.stages[i],v=clean(t.value);
    if(!v||P.stages.some((s,j)=>j!==i&&s.toLowerCase()===v.toLowerCase())||/^(won|lost)$/i.test(v)){t.value=old;return toast('Use a new, unique stage name')}

  }
}

drawer.addEventListener('submit',e=>{
  e.preventDefault();const f=e.target,v=f.elements.t.value.trim();if(!v)return;
  if(f.dataset.note){acts.push({cid:f.dataset.note,type:'note',when:new Date(),by:ME,text:v});dealOf(f.dataset.note).touched=new Date();refresh();toast('Note saved')}
  else if(f.dataset.addtask){projects.find(x=>x.id===f.dataset.addtask).tasks.push([v,0]);refresh();toast('Task added')}
  else if(f.dataset.addtag){
    const c=byC(f.dataset.addtag);let n=clean(v).slice(0,24);
    const known=allTags().find(x=>x.toLowerCase()===n.toLowerCase());if(known)n=known;
    if(n&&!c.tags.some(x=>x.toLowerCase()===n.toLowerCase())){c.tags.push(n);refresh();toast('Tag added')}else refresh();
    const inp=drawer.querySelector('[data-addtag] input');if(inp)inp.focus();
  }
  else if(f.hasAttribute('data-addstage')){const P=PIPES[state.drawer.id],n=clean(v);if(!n||/^(won|lost)$/i.test(n)||P.stages.some(s=>s.toLowerCase()===n.toLowerCase()))return toast('Use a new, unique stage name');P.stages.splice(P.stages.length-2,0,n);refresh();toast('Stage added')}
});

/* ---------- Modal ---------- */
const mWrap=$('#modalWrap'),modal=$('#modal');
function openModal({title,body,submit,onSubmit}){
  modal.innerHTML=`<form novalidate><header class="m-head"><h2>${title}</h2><button type="button" class="icon-btn" data-mclose aria-label="Close">${I.x}</button></header><div class="m-body">${body}</div><footer class="m-foot"><button type="button" class="btn" data-mclose>Cancel</button><button class="btn primary">${submit}</button></footer></form>`;
  mWrap.hidden=false;
  const f=modal.querySelector('form');
  f.onsubmit=e=>{e.preventDefault();if(onSubmit(f.elements)!==false)closeModal()};
  modal.querySelectorAll('[data-mclose]').forEach(b=>b.onclick=closeModal);
  setTimeout(()=>{(modal.querySelector('.m-body input:not([type=radio]),.m-body textarea')||modal.querySelector('.m-foot .btn.primary')).focus()},30);
}
function closeModal(){mWrap.hidden=true;modal.innerHTML=''}
mWrap.addEventListener('mousedown',e=>{if(e.target===mWrap)closeModal()});
function showErr(msg){const e=modal.querySelector('.err');e.textContent=msg;e.hidden=false;return false}
function logCall(did){
  const d=deals.find(x=>x.id===did),c=byC(d.cid);
  openModal({title:'Log call with '+esc(first(c.name)),submit:'Save',body:`
    <p class="m-sub">${esc(c.name)}${c.company?', '+esc(c.company):''}. ${theirTime(c.tz).time} their time.</p>
    <fieldset class="chips"><legend>Outcome</legend>${['Connected','No answer','Left voicemail','Booked a call'].map((o,i)=>`<label><input type="radio" name="o" value="${o}" ${i?'':'checked'}><span>${o}</span></label>`).join('')}</fieldset>
    <label>Notes<textarea name="notes" rows="3" placeholder="What did you learn?"></textarea></label>
    <div class="row2"><label>Next step<input name="next" value="${esc(d.next)}"></label>
    <label>When<select name="when"><option value="1">Tomorrow</option><option value="2">In 2 days</option><option value="7">Next week</option><option value="">No next step</option></select></label></div>`,
    onSubmit(E){
      const o=E.o.value,n=E.notes.value.trim();
      acts.push({cid:c.id,type:'call',when:new Date(),by:ME,text:o+(n?'. '+n:'.')});
      d.next=E.next.value.trim();d.due=E.when.value?at(+E.when.value,10):null;d.touched=new Date();
      refresh();toast('Call logged');
    }});
}
function newContact(){
  openModal({title:'New contact',submit:'Add contact',body:`
    <label>Full name<input name="name" autocomplete="off"></label>
    <label>Business <span class="opt">Leave empty for agency leads</span><input name="company" autocomplete="off"></label>
    <div class="row2"><label>Email<input name="email" type="email" autocomplete="off"></label><label>Phone<input name="phone" type="tel" autocomplete="off"></label></div>
    <div class="row2"><label>Location<select name="city">${Object.keys(CITY).map(k=>`<option>${k}</option>`).join('')}</select></label>
    <label>Source<select name="source">${SOURCES.map(s=>`<option>${s}</option>`).join('')}</select></label></div>
    <div class="row2"><label>Pipeline<select name="pipe">${Object.entries(PIPES).map(([k,p])=>`<option value="${k}">${esc(p.name)}</option>`).join('')}</select></label>
    <label>Deal value (USD)<input name="value" inputmode="numeric" value="10000"></label></div>
    <div class="row2"><label>Owner<select name="owner">${ownerOpts(ME)}</select></label><label>Tags <span class="opt">comma separated</span><input name="tags" autocomplete="off"></label></div>
    <p class="err" hidden></p>`,
    onSubmit(E){
      const name=E.name.value.trim(),email=E.email.value.trim().toLowerCase(),value=parseInt(E.value.value.replace(/\D/g,''),10);
      if(!name)return showErr('Add a name.');
      if(!isEmail(email))return showErr('Add a valid email.');
      if(contacts.some(c=>c.email===email))return showErr('A contact with this email already exists.');
      if(!value)return showErr('Add a deal value in USD.');
      const id='c'+(++seq),city=E.city.value;
      contacts.push({id,name:clean(name),company:clean(E.company.value),city,tz:CITY[city][0],email,phone:E.phone.value.trim()||'Not added',source:E.source.value,added:new Date(),tags:[...new Set(E.tags.value.split(',').map(x=>clean(x).slice(0,24)).filter(Boolean))]});
      deals.push({id:'d'+seq,cid:id,pipe:E.pipe.value,stage:PIPES[E.pipe.value].stages[0],value,owner:E.owner.value,next:'First call',due:at(0,Math.min(NOW.getHours()+1,23)),touched:new Date(),closedAt:null});
      acts.push({cid:id,type:'added',when:new Date(),by:ME,text:'Added by hand. Source: '+E.source.value});
      setTimeout(()=>{refresh();openDrawer('contact',id);toast('Contact added')},0);
    }});
}
function invite(){
  openModal({title:'Invite to the workspace',submit:'Send invite',body:`
    <label>Work email<input name="email" type="email" placeholder="name@${DOMAIN}"></label>
    <label>Role<select name="role">${ROLES.map(r=>`<option ${r==='Setter'?'selected':''}>${r}</option>`).join('')}</select></label>
    <p class="m-sub small">They’ll get a sign in link that expires in 48 hours.</p>
    <p class="err" hidden></p>`,
    onSubmit(E){
      const email=E.email.value.trim().toLowerCase();
      if(!email.endsWith('@'+DOMAIN)||email.length<=DOMAIN.length+1)return showErr('Only @'+DOMAIN+' emails can be invited.');
      if(Object.values(TEAM).some(u=>u.email===email))return showErr('That person is already on the team.');
      const local=email.split('@')[0];
      TEAM['u'+Date.now().toString(36)]={name:local.charAt(0).toUpperCase()+local.slice(1),role:E.role.value,email,last:'Never',status:'Invited'};
      auditLog.unshift(['Ali Nawaz invited '+email+' as '+E.role.value+'.','Just now']);
      render();toast('Invite sent');
    }});
}

/* ---------- Ask (chat) ---------- */
const chatEl=$('#chat'),chatBody=$('#chatBody'),chatIn=$('#chatIn'),chatSend=$('#chatSend');
let sampleFn,sampleReady=false,chatTurns=[],chatCtl=null;
const SUGG=['Who should I call first today?','Which deals are going cold?','What’s waiting on a proposal?','Summarise the agency pipeline'];
(async()=>{try{if(window.claude&&typeof window.claude.use==='function')sampleFn=await window.claude.use('sample')}catch(e){sampleFn=null}sampleReady=true;if(!chatTurns.length)chatIntro()})();
function chatIntro(){
  if(sampleReady&&!sampleFn){chatBody.innerHTML=`<p class="chat-intro">Ask only works when this preview is opened inside Claude. In the real build it runs on our server, so every rep has it.</p>`;chatIn.disabled=true;chatSend.disabled=true;return}
  chatBody.innerHTML=`<p class="chat-intro">Ask anything about your contacts, deals or team.</p><div class="sugg">${SUGG.map(s=>`<button type="button" data-sugg="${esc(s)}">${esc(s)}</button>`).join('')}</div>`;
}
function openChat(){appEl.classList.add('chat-open');$('#askBtn').setAttribute('aria-expanded','true');if(!chatTurns.length)chatIntro();setTimeout(()=>chatIn.focus(),30)}
function closeChat(){appEl.classList.remove('chat-open');$('#askBtn').setAttribute('aria-expanded','false');if(chatCtl)chatCtl.abort()}
$('#askBtn').onclick=()=>appEl.classList.contains('chat-open')?closeChat():openChat();
$('#chatClose').onclick=closeChat;
chatBody.addEventListener('click',e=>{
  const s=e.target.closest('[data-sugg]');if(s)return sendChat(s.dataset.sugg);
  const l=e.target.closest('[data-clink]');if(l&&byC(l.dataset.clink))openDrawer('contact',l.dataset.clink);
});
function fmtAnswer(text){
  const inline=s=>esc(s).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\[\[(c\d+)\|([^\]]+)\]\]/g,(m,id,n)=>`<button type="button" class="clink" data-clink="${id}">${n}</button>`);
  const out=[];let list=[];
  text.replace(/\u2014|\u2013/g,',').split('\n').forEach(line=>{
    const t=line.trim();if(/^[-*] /.test(t)){list.push(`<li>${inline(t.slice(2))}</li>`);return}
    if(list.length){out.push(`<ul>${list.join('')}</ul>`);list=[]}
    if(t)out.push(`<p>${inline(t)}</p>`);
  });
  if(list.length)out.push(`<ul>${list.join('')}</ul>`);
  return out.join('');
}
function snapshot(){
  return JSON.stringify({
    today:NOW.toDateString(),askedBy:'Ali Nawaz (Admin)',
    team:Object.values(TEAM).map(u=>({name:u.name,role:u.role})),
    pipelines:Object.values(PIPES).map(p=>({name:p.name,stages:p.stages})),
    contacts:contacts.map(c=>{const d=dealOf(c.id);if(!d)return null;return {id:c.id,name:c.name,business:c.company||null,city:c.city,theirTimeNow:theirTime(c.tz).time,source:c.source,tags:c.tags,pipeline:PIPES[d.pipe].name,stage:d.stage,valueUSD:d.value,owner:(TEAM[d.owner]||{}).name,nextStep:isOpen(d)?(d.next||null):null,due:isOpen(d)?fmtDue(d.due):null,daysSinceLastContact:-dayDiff(d.touched),recent:acts.filter(a=>a.cid===c.id&&a.type!=='added').sort((a,b)=>b.when-a.when).slice(0,4).map(a=>`${fmtAgo(a.when)}, ${(TEAM[a.by]||{name:'Someone'}).name}: ${a.text}`)}}).filter(Boolean),
    deliveryProjects:projects.map(p=>({client:p.client,name:p.name,stage:p.stage,owner:(TEAM[p.owner]||{}).name,tasksDone:p.tasks.filter(t=>t[1]).length,tasksTotal:p.tasks.length}))
  });
}
const INSTR=`You are the assistant inside a sales CRM used by a small sales team selling AI services. Answer using only the CRM data provided. If the data doesn't contain the answer, say so plainly. Be brief and practical: 1 to 4 short sentences, or a few lines starting with "- " when listing deals. Use plain language and US dollars. Never use em dashes or en dashes. Whenever you mention a contact, write it exactly as [[id|Full Name]], for example [[c1|Dave Morales]].`;
async function sendChat(q){
  q=String(q||'').trim();if(!q||chatCtl||!sampleFn)return;
  if(!chatTurns.length)chatBody.innerHTML='';
  chatIn.value='';chatIn.style.height='';
  chatBody.insertAdjacentHTML('beforeend',`<div class="msg you">${esc(q)}</div>`);
  const bot=document.createElement('div');bot.className='msg bot';bot.innerHTML='<p class="thinking">Thinking</p>';chatBody.appendChild(bot);chatBody.scrollTop=chatBody.scrollHeight;
  const history=chatTurns.slice(-8);
  const input=[...history,{role:'user',content:`${INSTR}\n\nCRM data, as of now:\n${snapshot()}\n\nQuestion: ${q}`}];
  chatCtl=new AbortController();chatSend.textContent='Stop';chatSend.type='button';
  try{
    const {text}=await sampleFn(input,{modelTier:'quick',cache:false,signal:chatCtl.signal,onText:({text})=>{bot.innerHTML=fmtAnswer(text);chatBody.scrollTop=chatBody.scrollHeight}});
    bot.innerHTML=fmtAnswer(text);
    chatTurns.push({role:'user',content:q},{role:'assistant',content:text});
  }catch(e){
    const keep=e&&e.text?fmtAnswer(e.text):'';
    const msg=e&&e.code==='not_granted'?'Ask needs permission to use Claude. Reload the page and allow it.':e&&e.code==='rate_limited'?'Too many questions at once. Wait a moment and try again.':e&&e.code==='aborted'?'Stopped.':'Couldn’t get an answer. Try again.';
    bot.innerHTML=keep+`<p class="msg-err">${msg}</p>`;
    if(e&&e.code==='not_granted'){chatIn.disabled=true;chatSend.disabled=true}
  }finally{chatCtl=null;chatSend.textContent='Send';chatSend.type='submit';chatBody.scrollTop=chatBody.scrollHeight}
}
$('#chatForm').addEventListener('submit',e=>{e.preventDefault();sendChat(chatIn.value)});
chatSend.addEventListener('click',e=>{if(chatCtl){e.preventDefault();chatCtl.abort()}});
chatIn.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendChat(chatIn.value)}});
chatIn.addEventListener('input',()=>{chatIn.style.height='';chatIn.style.height=Math.min(chatIn.scrollHeight,140)+'px'});

/* ---------- Top bar, keys, theme ---------- */
$('#searchIco').outerHTML=I.search;$('#plusIco').outerHTML=I.plus;$('#askIco').outerHTML=I.ask;$('#askIco2').outerHTML=I.ask;$('#chatClose').innerHTML=I.x;
const qEl=$('#q');
qEl.addEventListener('input',()=>{state.q=qEl.value;if(location.hash!=='#contacts')location.hash='#contacts';else render()});
$('#newBtn').onclick=newContact;
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){if(!mWrap.hidden)closeModal();else if(state.drawer)closeDrawer();else if(appEl.classList.contains('chat-open'))closeChat()}
  if(e.key==='/'&&!appEl.hidden&&!e.target.closest('input,textarea,select')){e.preventDefault();qEl.focus()}
});
const themes=['system','light','dark'];let ti=0;
try{const s=localStorage.getItem('crm-theme');if(themes.includes(s))ti=themes.indexOf(s)}catch(e){}
function applyTheme(){const t=themes[ti];if(t==='system')document.documentElement.removeAttribute('data-theme');else document.documentElement.setAttribute('data-theme',t);$('#themeBtn').textContent=t==='system'?'Theme: auto':'Theme: '+t}
$('#themeBtn').onclick=()=>{ti=(ti+1)%3;applyTheme();try{localStorage.setItem('crm-theme',themes[ti])}catch(e){}};
applyTheme();

stepStart();
})();
</script>
